# Server
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:observabilitydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# OpenTelemetry Configuration
otel.service.name=crud-otel-application

# Colorized logging pattern: trace_id in magenta, message in bright text
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([trace_id=%X{trace_id:-} span_id=%X{span_id:-}]){magenta} %clr([%15.15t]){faint} %clr(%-35.35logger{36}){cyan} : %clr(%msg){yellow}%n
logging.level.org.springframework=INFO
logging.level.com.example.observability=INFO